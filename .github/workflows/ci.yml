name: checks
on: [push, pull_request]
jobs:
 check:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 20
      cache: npm
   - run: sudo apt-get install -y ffmpeg
   - run: npm ci
   - run: npm run seed
   - run: npm run typecheck
   - run: npm run lint
   - run: npm test
   - run: npm run build
   - run: npm run build:pcf
   - run: npx playwright install --with-deps chromium
   - run: PLAYWRIGHT_CHROMIUM_EXECUTABLE= npm run e2e
